name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet run --project tests/OtpVectors/OtpVectors.csproj -c Release
      - run: dotnet publish src/NoirAuth/NoirAuth.csproj -c Release -r win-x64 --self-contained true -p:WindowsAppSDKSelfContained=true -p:AppxGeneratePriEnabled=false -o artifacts/publish
      - name: Package portable app
        shell: pwsh
        run: |
          Compress-Archive -Path artifacts/publish/* -DestinationPath NoirAuth-win-x64.zip
          (Get-FileHash NoirAuth-win-x64.zip -Algorithm SHA256).Hash.ToLower() | Set-Content NoirAuth-win-x64.zip.sha256
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: NoirAuth-win-x64.zip
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            NoirAuth-win-x64.zip
            NoirAuth-win-x64.zip.sha256

name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet run --project tests/OtpVectors/OtpVectors.csproj -c Release
      - run: msbuild src/WinOTP/WinOTP.csproj /restore /t:Publish /p:Configuration=Release /p:RuntimeIdentifier=win-x64 /p:SelfContained=true /p:WindowsAppSDKSelfContained=true /p:PublishDir=artifacts/publish/ /verbosity:minimal
      - name: Install Inno Setup
        run: choco install innosetup --no-progress
      - name: Build installer and checksum
        shell: pwsh
        run: |
          $xaml = @(Get-ChildItem src/WinOTP/bin/Release -Filter *.xbf -File -Recurse)
          if ($xaml.Count -eq 0) { throw 'No compiled WinUI XAML resources were produced.' }
          Copy-Item -Path $xaml.FullName -Destination src/WinOTP/artifacts/publish/ -Force
          if (-not (Test-Path src/WinOTP/artifacts/publish/WinOTP.exe)) { throw 'Missing WinOTP executable.' }
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $compiler)) { throw 'Inno Setup compiler was not installed.' }
          & $compiler installer/WinOTP.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed.' }
          $hash = (Get-FileHash artifacts/WinOTP-Setup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  WinOTP-Setup.exe" | Set-Content artifacts/SHA256SUMS.txt -Encoding ascii
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: artifacts/WinOTP-Setup.exe
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            artifacts/WinOTP-Setup.exe
            artifacts/SHA256SUMS.txt
